<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="sync-states-light-root" viewBox="0 0 400 592" width="400" height="592" role="img" aria-labelledby="sync-states-light-title sync-states-light-desc"><title id="sync-states-light-title">A local change is not yet server-confirmed</title><desc id="sync-states-light-desc">A local change waits for synchronization, retries while offline, and becomes confirmed only after server review, with conflicts returning for resolution and retry.</desc><defs><marker id="sync-states-light-arrow" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#5c6753"/></marker><marker id="sync-states-light-accent" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#496a3f"/></marker></defs><rect width="400" height="592" fill="#fbf8f1"/><path d="M 184 112 L 192 112 Q 200 112 200 104 L 200 64 Q 200 56 208 56 L 272 56 Q 280 56 280 64 L 280 80" fill="none" stroke="#5c6753" stroke-width="1.5" marker-end="url(#sync-states-light-arrow)"/><path d="M 280 144 L 280 256" fill="none" stroke="#5c6753" stroke-width="1.5" marker-end="url(#sync-states-light-arrow)"/><path d="M 352 112 L 368 112 Q 376 112 376 120 L 376 176 Q 376 184 368 184 L 320 184 Q 312 184 312 176 L 312 144" fill="none" stroke="#5c6753" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#sync-states-light-arrow)"/><path d="M 216 288 L 208 288 Q 200 288 200 280 L 200 232 Q 200 224 192 224 L 124 224 Q 116 224 116 232 L 116 256" fill="none" stroke="#5c6753" stroke-width="1.5" marker-end="url(#sync-states-light-arrow)"/><path d="M 280 320 L 280 408 Q 280 416 272 416 L 124 416 Q 116 416 116 424 L 116 448" fill="none" stroke="#5c6753" stroke-width="1.5" marker-end="url(#sync-states-light-arrow)"/><path d="M 48 480 L 32 480 Q 24 480 24 472 L 24 184 Q 24 176 32 176 L 192 176 Q 200 176 200 168 L 200 136 Q 200 128 208 128 L 216 128" fill="none" stroke="#5c6753" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#sync-states-light-arrow)"/><rect x="214" y="28" width="52" height="20" rx="2" fill="#fbf8f1"/><text x="240" y="42" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#5c6753">QUEUE</text><rect x="212" y="202" width="60" height="20" rx="2" fill="#fbf8f1"/><text x="242" y="216" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#5c6753">ONLINE</text><rect x="310" y="192" width="68" height="20" rx="2" fill="#fbf8f1"/><text x="344" y="206" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#5c6753">OFFLINE</text><rect x="122" y="196" width="72" height="20" rx="2" fill="#fbf8f1"/><text x="158" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#5c6753">ACCEPTED</text><rect x="200" y="378" width="72" height="20" rx="2" fill="#fbf8f1"/><text x="236" y="392" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#5c6753">CONFLICT</text><rect x="32" y="202" width="52" height="20" rx="2" fill="#fbf8f1"/><text x="58" y="216" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#5c6753">RETRY</text><g data-node="localchange"><rect x="48" y="80" width="136" height="64" rx="6" fill="#fbf8f1" stroke="#5c6753" stroke-width="1.2"/><text x="116" y="117" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#31423a">Local change</text></g><g data-node="pending"><rect x="216" y="80" width="136" height="64" rx="6" fill="#eeeee2" stroke="#5c6753" stroke-width="1.2"/><text x="284" y="117" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#31423a">Pending sync</text></g><g data-node="serverreview"><rect x="216" y="256" width="136" height="64" rx="6" fill="#fbf8f1" stroke="#5c6753" stroke-width="1.2"/><text x="284" y="293" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#31423a">Server review</text></g><g data-node="confirmed"><rect x="48" y="256" width="136" height="64" rx="20" fill="#e9efda" stroke="#496a3f" stroke-width="1.2"/><text x="116" y="293" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#496a3f">Synced</text></g><g data-node="resolve"><rect x="48" y="448" width="136" height="64" rx="6" fill="#fbf8f1" stroke="#5c6753" stroke-width="1.2"/><text x="116" y="485" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#31423a">Resolve conflict</text></g><line x1="40" y1="540" x2="360" y2="540" stroke="#cbd0bc"/><text x="40" y="564" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#5c6753">Proposed states; sync under development</text></svg>
