<svg xmlns="http://www.w3.org/2000/svg" width="680" height="248" viewBox="0 0 680 248" role="img" aria-labelledby="clinic-title clinic-description">
  <title id="clinic-title">Doctoleb: a clinic's working day</title>
  <desc id="clinic-description">Concept illustration of intended product scope, not an application screenshot. Reception plans the day, doctors follow visits, and administrators manage clinic setup.</desc>
  <style>text{font-family:Segoe UI,Arial,sans-serif;font-size:28px;font-weight:500;fill:#f1ece2}.small{font-size:24px;font-weight:400}</style>
  <rect width="680" height="248" rx="14" fill="#171f26"/>

  <g fill="#202c34" stroke="#3c4b54" stroke-width="2">
    <rect x="24" y="20" width="197" height="208" rx="12"/>
    <rect x="242" y="20" width="197" height="208" rx="12"/>
    <rect x="460" y="20" width="197" height="208" rx="12"/>
  </g>
  <g fill="#e3a06c">
    <rect x="24" y="20" width="197" height="7" rx="3"/>
    <rect x="242" y="20" width="197" height="7" rx="3"/>
    <rect x="460" y="20" width="197" height="7" rx="3"/>
  </g>
  <text class="small" x="42" y="64">Reception</text>
  <text class="small" x="260" y="64">Doctors</text>
  <text class="small" x="478" y="64">Administration</text>
  <text x="42" y="111">Plan</text>
  <text x="42" y="147">the day.</text>
  <text x="260" y="111">Follow</text>
  <text x="260" y="147">the visit.</text>
  <text x="478" y="111">Manage</text>
  <text x="478" y="147">the clinic.</text>
  <g stroke="#3c4b54" stroke-width="2">
    <path d="M42 171H203 M260 171H421 M478 171H639"/>
