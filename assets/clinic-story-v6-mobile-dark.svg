<title id="clinicTitle">Doctoleb: AI clinic management and WhatsApp assistance</title>
<desc id="clinicDesc">A staff request passes through the AI agent&#x27;s plan, navigation and action steps into a clinic workspace with appointments, patient profiles, reports and payment analysis. A separate WhatsApp conversation connects only to appointments and patient profiles. Generated reports follow a distinct route to each clinic&#x27;s review and validation.</desc>
